<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flight Booking</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/layoutSizing.css" />
</head>

<!--Page Container-->

<body class="d-flex flex-column min-vh-100">

    <!--Header Fragment-->
    <header th:replace="~{/fragments/navheader.html :: navheader}"></header>

    <!--Body Frame - Defines the Structure of the Body Content. 
    (Flex-grow-1 - Vertical definition, Container-Fluid - Horizontal definition)-->
    <main class="flex-grow-1 container-fluid">

        <!--Content Grid Container - Defines the Bootstrap Grid template for the Content-->
        <div class="row h-100">

            <!--Left Sidebar Fragment-->
            <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarLeft.html :: sidebarLeft}"></div>

            <!--Central Content-->
            <div class="col-12 col-lg-8 p-0 mt-4">

                <!--Welcome Banner-->
                <div class="jumbotron jumbotron-fluid">
                    <div class="container-fluid">
                        <h1 class="display-4 align-items-center">Booking Confirmation</h1>
                    </div>
                </div>

                <!--Flight Details Information Container-->
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-header">
                            <h4>Flight Details</h4>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <!-- Left Column - Departure Info -->
                                <div class="col-6">
                                    <dl class="row">
                                        <dt class="col-sm-6">Airline:</dt>
                                        <dd class="col-sm-7" th:text="${flight.airlineName}"></dd>

                                        <dt class="col-sm-6">Flight Number:</dt>
                                        <dd class="col-sm-7" th:text="${flight.flightNumber}"></dd>

                                        <dt class="col-sm-6">Airport Code:</dt>
                                        <dd class="col-sm-7" th:text="${flight.airportCode}"></dd>

                                        <dt class="col-sm-6">Departure:</dt>
                                        <dd class="col-sm-7"
                                            th:text="${flight.departureCity} + ', ' + ${flight.departureCountry}"></dd>

                                        <dt class="col-sm-6">Departure Airport:</dt>
                                        <dd class="col-sm-7" th:text="${flight.airportDepartureLocation}"></dd>

                                        <dt class="col-sm-6">Departure Time:</dt>
                                        <dd class="col-sm-7"
                                            th:text="${#temporals.format(flight.departureTime, 'h:mm a')}"></dd>

                                        <dt class="col-sm-6">Seat Class:</dt>
                                        <dd class="col-sm-7" th:text="${flight.seatClass}"></dd>
                                    </dl>
                                </div>

                                <!-- Right Column - Arrival Info & Details -->
                                <div class="col-6">
                                    <dl class="row">
                                        <dt class="col-sm-6">Arrival:</dt>
                                        <dd class="col-sm-7"
                                            th:text="${flight.arriveCity} + ', ' + ${flight.arriveCountry}"></dd>

                                        <dt class="col-sm-6">Arrival Airport:</dt>
                                        <dd class="col-sm-7" th:text="${flight.airportArriveLocation}"></dd>

                                        <dt class="col-sm-6">Arrival Time:</dt>
                                        <dd class="col-sm-7"
                                            th:text="${#temporals.format(flight.arriveTime, 'h:mm a')}"></dd>

                                        <dt class="col-sm-6">Flight Duration:</dt>
                                        <dd class="col-sm-7" th:text="${flight.flightDuration} + ' hours'"></dd>

                                        <dt class="col-sm-6">Passengers:</dt>
                                        <dd class="col-sm-7" th:text="${flight.numPassengers}"></dd>

                                        <dt class="col-sm-6">Price:</dt>
                                        <dd class="col-sm-7 fw-bold text-success" th:text="'$' + ${flight.price}"></dd>
                                    </dl>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!--Passenger Information Form-->
                <div class="container-fluid mt-4">
                    <div class="card">
                        <div class="card-header">
                            <h4>Passenger Information</h4>
                        </div>
                        <div class="card-body">
                            <form id="passengerForm">
                                <div class="row">
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="firstName" class="form-label">First Name</label>
                                            <input type="text" class="form-control" id="firstName" name="firstName"
                                                required>
                                        </div>

                                        <div class="mb-3">
                                            <label for="lastName" class="form-label">Last Name</label>
                                            <input type="text" class="form-control" id="lastName" name="lastName"
                                                required>
                                        </div>
                                    </div>

                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email" name="email"
                                                placeholder="example@email.com" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="phone" class="form-label">Phone</label>
                                            <input type="tel" class="form-control" id="phone" name="phone"
                                                placeholder="123-456-7890" required>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <button type="submit" class="btn btn-primary mt-3">Confirm Booking</button>
                                    </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--Right Sidebar Fragment-->
        <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarRight.html :: sidebarRight}"></div>

        </div>

    </main>

    <!-- Optional Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/bookFlight.js"></script>

</body>

</html>
