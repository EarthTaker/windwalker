<!--Toast Message for User Login / Registration Response-->
<div class="d-flex justify-content-center w-100" th:fragment="toastMessage">
    <div id="messageContainer" class="toast border-0 rounded-3" role="status" aria-live="polite" aria-atomic="true" data-bs-autohide="true" data-bs-delay="4000">
        <p id="message" class="toast-body text-center"></p>
    </div>
</div>
