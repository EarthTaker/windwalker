<!DOCTYPE html>
<!--Adds the Thymeleaf namespace. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Flight Results</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/layoutSizing.css" />
</head>

<!--Page Container-->

<body class="d-flex flex-column min-vh-100">

    <!--Header Fragment-->
    <header th:replace="~{/fragments/navheader.html :: navheader}"></header>

    <!--Body Frame - Defines the Structure of the Body Content. 
    (Flex-grow-1 - Vertical definition, Container-Fluid - Horizontal definition)-->
    <main class="flex-grow-1 container-fluid">

        <!--Content Grid Container - Defines the Bootstrap Grid template for the Content-->
        <div class="row h-100">

            <!--Left Sidebar Fragment-->
            <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarLeft.html :: sidebarLeft}"></div>

            <!--Central Content-->
            <div class="col-12 col-lg-8 p-0 mt-4">

                <!--Create a table listing all flights returning from the API Request.-->
                <table class="table table-striped" th:if="${flights}">
                    <thead>
                        <tr>
                            <th>Airline</th>
                            <th>Flight #</th>
                            <th>Departure Airport</th>
                            <th>Departure City</th>
                            <th>Departure Country</th>
                            <th>Departure Time</th>
                            <th>Arrival Airport</th>
                            <th>Arrival City</th>
                            <th>Arrival Country</th>
                            <th>Arrival Time</th>
                            <th>Duration</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!--For each flight in the flight list, display returned data.-->
                        <tr th:each="flight : ${flights}">
                            <td th:text="${flight.airlineName}"></td>
                            <td th:text="${flight.flightNumber}"></td>

                            <td th:text="${flight.airportDepartureLocation}"></td>
                            <td th:text="${flight.departureCity}"></td>
                            <td th:text="${flight.departureCountry}"></td>
                            <td th:text="${flight.departureTime}"></td>

                            <td th:text="${flight.airportArriveLocation}"></td>
                            <td th:text="${flight.arriveCity}"></td>
                            <td th:text="${flight.arriveCountry}"></td>
                            <td th:text="${flight.arriveTime}"></td>

                            <td th:text="${flight.flightDuration}"></td>
                            <td th:text="${flight.price}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!--Replace child DIV with Parent Fragment (Child home.html / Parent - sidebarRight.html)-->
            <div th:insert="~{fragments/sidebarRight.html :: sidebarRight}" class="col-2 d-none d-lg-block"></div>
        </div>

    </main>

    <!-- Optional Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
