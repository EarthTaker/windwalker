<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- CSRF Meta Tags - Required by Spring Security - Validates the form submission to prevent CSRF attacks -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/layoutSizing.css" />
</head>

<body class="d-flex flex-column min-vh-100">

    <!--Header Fragment-->
    <header th:replace="~{/fragments/navheader.html :: navheader}"></header>

    <!--Body Frame - Defines the Structure of the Body Content. 
    (Flex-grow-1 - Vertical definition, Container-Fluid - Horizontal definition)-->
    <main class="flex-grow-1 container-fluid">

        <!--Content Grid Container - Defines the Bootstrap Grid template for the Content-->
        <div class="row h-100">

            <!--Left Sidebar Fragment-->
            <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarLeft.html :: sidebarLeft}"></div>

            <!--Main Content-->
            <div class="mt-2 col-8 mx-auto">
                <div class="d-flex flex-column align-items-center">
                    <h2 class="text-left mb-2">Create an Account</h2>

                    <div class="d-flex flex-column align-items-center">
                        <form id="registerForm">
                            <div class="d-flex flex-row mb-3 gap-2">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="d-flex flex-row mb-3 gap-2">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" required>
                            </div>
                            <div class="d-flex flex-row mb-3 gap-2">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" name="lastName" required>
                            </div>
                            <div class="d-flex flex-row mb-3 gap-2">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="d-flex flex-row mb-3 gap-2"> <label for="password"
                                    class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary">Register</button>
                            </div>
                        </form>


                        <p class="text-center mt-2">
                            Already have an account? <a href="/user/login">Sign in</a>
                        </p>
                    </div>

                    <!--User Update - Login Failed-->
                    <div th:insert="~{fragments/toastMessage :: toastMessage}"></div>

                </div>
            </div>

            <!--Right Sidebar Fragment-->
            <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarRight.html :: sidebarRight}"></div>
        </div>
    </main>


    <!-- Optional Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/authUtility.js"></script>
    <script src="/js/register.js"></script>
</body>

</html>
