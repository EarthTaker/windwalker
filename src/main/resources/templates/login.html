<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>User Login</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/layoutSizing.css" />
</head>

<!--Defines login variable for Thymeleaf.-->

<body class="d-flex flex-column min-vh-100" th:with="page='login'">

    <!--Header Fragment-->
    <header th:replace="~{/fragments/navheader.html :: navheader}"></header>

    <!--Body Frame - Defines the Structure of the Body Content. 
    (Flex-grow-1 - Vertical definition, Container-Fluid - Horizontal definition)-->
    <main class="flex-grow-1 container-fluid">

        <!--Content Grid Container - Defines the Bootstrap Grid template for the Content-->
        <div class="row h-100">

            <!--Left Sidebar Fragment-->
            <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarLeft.html :: sidebarLeft}"></div>

            <!--Main Content-->
            <div class="mt-5 col-8 mx-auto">
                <div class="d-flex flex-column align-items-center">
                    <h2 class="text-center mb-2">Sign in or Create an Account</h2>
                    <p class="text-center mb-4">Discover yourself, one flight at a time.</p>

                    <form method="post" action="/user/home">
                        <div class="d-flex flex-row mb-3 gap-2">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="d-flex flex-row mb-3 gap-2">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                    </form>
                </div>
            </div>

            <!--Right Sidebar Fragment-->
            <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarRight.html :: sidebarRight}"></div>
        </div>
    </main>


    <!-- Optional Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/login.js"></script>
</body>

</html>
