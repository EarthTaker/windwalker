<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Windwalker - Home Page</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <h1>Flight Search</h1>
    <button onclick="location.href='/login'" class="btn btn-secondary mb-3">Login</button>
    <div class="container mt-4">
        <!--Flight Search Form-->
        <form method="get" action="/results">
            <!--From Destination-->
            <label for="from">From:</label>
            <input type="text" id="from" name="from" required>
            <br>
            <!--To Destination-->
            <label for="to">To:</label>
            <input type="text" id="to" name="to" required>
            <br>
            <!--Trip Type-->
            <label for="tripType">Trip Type</label>
            <select id="tripType" name="tripType">
                <option value="One-way">One-Way</option>
                <option value="Round-Trip">Round-Trip</option>
            </select>
            <br>
            <!--Departure Date-->
            <label for="departureDate">Departure Date:</label>
            <input type="date" id="departureDate" name="departureDate" required>
            <br>
            <!--Return Date-->
            <div id="returnDateGroup">
                <label for="returnDate">Return Date:</label>
                <input type="date" id="returnDate" name="returnDate">
                <br>
            </div>
            <!--Number of Passengers-->
            <label for="passengers">Number of Passengers:</label>
            <input type="number" id="passengers" name="passengers" min="1" value="1" required>
            <br>
            <!--Seat Class-->
            <label for="seatClass">Seat Class:</label>
            <select id="seatClass" name="seatClass">
                <option value="Economy">Economy</option>
                <option value="Business">Business</option>
                <option value="First Class">First Class</option>
            </select>
            <br>
            <input type="submit" value="Search Flights">
        </form>
    </div>


    <!-- Optional Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/search.js"></script>

</body>

</html>
