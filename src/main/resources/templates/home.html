<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windwalker - Home Page</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/layoutSizing.css" />
</head>

<!--Page Container-->
<!--Uses element dataset; reads from the User's Session -> Security Context - Authentication to handle UI/UX changes for Booking a flight.-->
<body class="d-flex flex-column min-vh-100" th:attr="data-authenticated=${#authorization.expression('isAuthenticated()')}">

    <!--Header Fragment-->
    <header th:replace="~{/fragments/navheader.html :: navheader}"></header>

    <!--Body Frame - Defines the Structure of the Body Content. 
    (Flex-grow-1 - Vertical definition, Container-Fluid - Horizontal definition)-->
    <main class="flex-grow-1 container-fluid">

        <!--Content Grid Container - Defines the Bootstrap Grid template for the Content-->
        <div class="row h-100">

            <!--Left Sidebar Fragment-->
            <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarLeft.html :: sidebarLeft}"></div>

            <!--Central Content-->
            <div class="col-12 col-lg-8 p-0 mt-4">

                <!--Welcome Banner-->
                <div class="jumbotron jumbotron-fluid">
                    <div class="container-fluid">
                        <h1 class="display-4">It's your turn to Fly!</h1>
                        <p class="lead">Begin your adventure below.</p>
                    </div>
                </div>

                <!--Flight Search Form-->
                <form class="d-flex flex-column" id="flightSearchForm" name="flightSearchForm">

                    <div class="d-flex flex-row flex-wrap gap-4 justify-content-center mx-auto mt-3">

                        <!-- From / To -->
                        <div class="d-flex flex-column gap-2">
                            <label for="from">From</label>
                            <input type="text" class="form-control" id="from" name="from" placeholder="Current Location"
                                required>

                            <label for="to">To</label>
                            <input type="text" class="form-control" id="to" name="to" placeholder="Destination Location"
                                required>
                        </div>


                        <!-- Trip Type -->
                        <div class="d-flex flex-column gap-2">
                            <label for="tripType">Trip Type</label>
                            <select id="tripType" name="tripType" class="form-select">
                                <option value="One-way">One-Way</option>
                                <option value="Round-Trip">Round-Trip</option>
                            </select>

                            <!-- Seat Class -->
                            <div class="d-flex flex-column gap-2">
                                <label for="seatClass">Seat Class</label>
                                <select id="seatClass" name="seatClass" class="form-select">
                                    <option value="Economy">Economy</option>
                                    <option value="Business">Business</option>
                                    <option value="First Class">First Class</option>
                                </select>
                            </div>
                        </div>

                        <!--Departure / Return Container-->
                        <div class="d-flex flex-column gap-2">
                            <label for="departureDate">Departure Date</label>
                            <input type="date" class="form-control" id="departureDate" name="departureDate" required>

                            <div id="returnDateGroup">
                                <label for="returnDate">Return Date</label>
                                <input type="date" class="form-control" id="returnDate" name="returnDate">
                            </div>
                        </div>

                        <!-- Number of Travelers -->
                        <div class="d-flex flex-column gap-2">
                            <label for="passengers">Number of Travelers</label>
                            <input type="number" class="form-control" id="passengers" name="passengers" min="1"
                                value="1" required>
                        </div>

                    </div>

                    <!-- Submit Button -->
                    <div class="d-flex flex-row justify-content-end mt-4 me-5">
                        <button type="submit" class="btn btn-primary">Search</button>
                    </div>

                </form>

                <!--Flight Results Display Container-->
                <div id="flightResultsContainer" class="container mt-5" style="display: none;">
                    <div id="flight-results-header" class="d-flex flex-row gap-2 align-items-center">
                        <h3 class="flex-column">Flight Results</h3>
                        <a sec:authorize="!isAuthenticated()" class="flex-column" href="/login">Login to Book</a>
                    </div>
                    <div id="flight-results_InnerContainer"></div>
                </div>

            </div>

            <!--Right Sidebar Fragment-->
            <div class="col-2 p-0 d-none d-lg-block" th:insert="~{fragments/sidebarRight.html :: sidebarRight}"></div>

        </div>

    </main>

    <!-- Optional Bootstrap JS -->
    <script src="/js/search.js"></script>
    <script src="/js/results.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
